# ==============================================================================
# 📄 ゴール単位コンテキストアンカー
# コピー先: .oyakata/L-NNN_short_goal.yaml
# ==============================================================================
project:
  id: "L-001" # ファイル名の連番と一致させる
  goal: "${達成したい最終的なゴールを記述。例: ローカル認証ロジックの実装と単体テストの全通}"
  
  # AIへの行動縛り（機密漏洩や無駄なハルシネーションを防止）
  constraints:
    - "完全ローカル完結。外部APIの呼び出しや外部サーバーへのデータ送信は一切禁止"
    - "環境変数はすべてローカルのファイル（.envなど）からのみ読み込むこと"
    - "アクティブなタスクの target_files に指定されたファイル以外は編集禁止"

  # 機械判定可能、または客観的に検証可能な成功条件
  success_criteria:
    - "${成功条件1: 例: src/auth/local.ts にロジックが実装されていること}"
    - "${成功条件2: 例: npm run test:auth でテストが100%パスすること}"

# ------------------------------------------------------------------------------
# 🛠 タスクバックログ (直列かつ最小限の進捗追跡)
# ------------------------------------------------------------------------------
# status の規定: "pending" (未着手) / "in_progress" (進行中) / "completed" (完了)
# ------------------------------------------------------------------------------
backlog:
  - id: "T001"
    title: "${タスク1のタイトル}"
    status: "pending"
    executor: "agy" # executors.yaml の executors または selection のキー
    executor_history:
      - executor: "agy"
        reason: "${Leadが選んだ理由}"
        changed_by: "lead"
    delegation:
      approval: "not_requested" # not_requested / approved
      approved_executor: null
      approved_target_files: []
    target_files:
      - "${編集するファイルパス1}"
    verification: "${検証用ローカルコマンド、または確認手順}"

  - id: "T002"
    title: "${タスク2のタイトル}"
    status: "pending"
    executor: "grok" # executors.yaml の executors または selection のキー
    executor_history:
      - executor: "grok"
        reason: "${Leadが選んだ理由}"
        changed_by: "lead"
    delegation:
      approval: "not_requested" # not_requested / approved
      approved_executor: null
      approved_target_files: []
    target_files:
      - "${編集するファイルパス2}"
    verification: "${検証用ローカルコマンド、または確認手順}"

# ==============================================================================
# 🧠 知見の波及 (AIが自律的に追記するPJ固有の注意点・バグ回避メモ)
# ==============================================================================
learnings: [] # タスク完了時にAIが自動追記するため、初期状態は空欄でOK
