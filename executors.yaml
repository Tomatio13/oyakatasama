# User-editable runtime definitions for Oyakatasama.
# Change commands, arguments, and models here; SKILL.md must not duplicate them.
# Never put API keys, cookies, tokens, passwords, or .env values in this file.
lead:
  executor: codex

reviewer:
  executor: codex

executors:
  codex:
    command: current_codex_session
    model: gpt-5.6-medium
    delegable: false
    data_boundary: current_session
    requires_unsandboxed_runtime: false

  grok:
    command: grok
    model: grok-4.5
    delegable: true
    data_boundary: external_service
    requires_unsandboxed_runtime: true
    quota_provider: grok
    quota_windows: [primary]
    args:
      - -p
      - "{prompt}"
      - --permission-mode
      - bypassPermissions

  opencode:
    command: opencode
    model: zai-coding-plan/glm-5.2
    delegable: true
    data_boundary: external_service
    requires_unsandboxed_runtime: true
    quota_provider: zai
    # z.ai secondary is Total Monthly Web Search, not coding-plan capacity.
    quota_windows: [primary]
    args:
      - run
      - --model
      - "{model}"
      - --auto
      - "{prompt}"

  agy:
    command: agy
    model: Gemini 3.5 Flash (Medium)
    delegable: true
    data_boundary: external_service
    requires_unsandboxed_runtime: true
    args:
      - --print
      - "{prompt}"
      - --dangerously-skip-permissions

research:
  web_executor: agy
  x_executor: grok

# Add, rename, or remove selectors freely. Tasks reference the selector key.
selection:
  quota_selected:
    # These are only the default candidates; use any executor IDs with quota_provider.
    candidates:
      - grok
      - opencode
    tie_breaker: grok
    fallback_executor: opencode
